<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Generator</title>
<!-- Stand-ins for the guide's fonts: Beaufort Pro Heavy → Merriweather Black, Avenir Next Condensed → Barlow Semi Condensed.
     Offline, the page falls back to Georgia / Arial Narrow and still works. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/nimble.css">
</head>
<body>
<main>
  <a class="back" href="../">← All tools</a>
  <h1>Combat Generator</h1>

  <section class="block setup">
    <div class="row">
      <div class="field">
        <span class="label">Heroes</span>
        <div class="stepper"><button type="button" data-step="-1" aria-label="Fewer heroes">−</button><input id="heroes" type="number" min="1" max="10" value="4" inputmode="numeric" aria-label="Heroes"><button type="button" data-step="1" aria-label="More heroes">+</button></div>
      </div>
      <div class="field">
        <span class="label">Level</span>
        <div class="stepper"><button type="button" data-step="-1" aria-label="Lower level">−</button><input id="level" type="number" min="1" max="20" value="1" inputmode="numeric" aria-label="Hero level"><button type="button" data-step="1" aria-label="Higher level">+</button></div>
      </div>
      <div class="field">
        <span class="label">Fight</span>
        <div class="seg" id="mode">
          <button type="button" data-value="standard" aria-pressed="true">Monsters</button>
          <button type="button" data-value="legendary" aria-pressed="false">Boss</button>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="label">Difficulty</span>
      <div class="seg" id="difficulty">
        <button type="button" data-value="easy" aria-pressed="false">Easy</button>
        <button type="button" data-value="medium" aria-pressed="false">Medium</button>
        <button type="button" data-value="hard" aria-pressed="true">Hard</button>
        <button type="button" data-value="deadly" aria-pressed="false" class="danger">Deadly</button>
        <button type="button" data-value="veryDeadly" aria-pressed="false" class="danger">Very Deadly</button>
      </div>
    </div>

    <details class="more">
      <summary>More options</summary>
      <div class="grid">
        <label class="field"><span class="label">Armor</span>
          <select id="armor">
            <option value="random">Mixed</option>
            <option value="none">None</option>
            <option value="medium">Medium</option>
            <option value="heavy">Heavy</option>
          </select>
        </label>
        <label class="field"><span class="label">Dice</span>
          <select id="die">
            <option value="any">Any</option>
            <option value="4">d4 (undead)</option>
            <option value="6">d6 (goblins)</option>
            <option value="8">d8 (humans)</option>
            <option value="10">d10 (beasts)</option>
            <option value="12">d12 (giants)</option>
            <option value="20">d20 (mightiest)</option>
          </select>
        </label>
        <label class="field"><span class="label">Minions</span>
          <select id="minions">
            <option value="0">None</option>
            <option value="1">1 per hero</option>
            <option value="2">2 per hero</option>
            <option value="3">3 per hero</option>
            <option value="4">4 per hero</option>
          </select>
        </label>
        <label class="field"><span class="label">Paid by</span>
          <select id="patron">
            <option value="poor">Poor</option>
            <option value="modest">Modest</option>
            <option value="standard" selected>Normal</option>
            <option value="wealthy">Wealthy</option>
            <option value="lavish">Very rich</option>
          </select>
        </label>
        <label class="field check"><input id="abilities" type="checkbox"> Special abilities</label>
      </div>
    </details>
  </section>

  <div id="out"></div>

  <p class="foot"><a href="../docs/rules-reference.html">Rules reference</a><br>ChongKit is an independent product published under the Nimble 3rd Party Creator License and is not affiliated with Nimble Co. Nimble © 2025 Nimble Co.</p>
</main>

<script src="nimble-data.js"></script>
<script src="generator.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const out = $('out');
  let current = null;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const gp = (n) => n.toLocaleString() + ' gp';
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  // --- Setup controls -------------------------------------------------------
  const segValue = (id) => $(id).querySelector('[aria-pressed="true"]').dataset.value;

  function readOpts() {
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, parseInt(v, 10) || lo));
    return {
      heroes: clamp($('heroes').value, 1, 10),
      level: clamp($('level').value, 1, 20),
      difficulty: segValue('difficulty'),
      mode: segValue('mode'),
      armor: $('armor').value,
      die: $('die').value,
      minionsPerHero: parseInt($('minions').value, 10),
      patron: $('patron').value,
      abilities: $('abilities').checked,
    };
  }

  document.querySelectorAll('.seg').forEach((seg) => seg.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    const boss = segValue('mode') === 'legendary';
    $('minions').disabled = boss; $('abilities').disabled = boss;
    generate();
  }));

  document.querySelectorAll('.stepper').forEach((st) => {
    const inp = st.querySelector('input');
    st.addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      const v = Math.min(+inp.max, Math.max(+inp.min, (parseInt(inp.value, 10) || 0) + Number(b.dataset.step)));
      if (v !== +inp.value) { inp.value = v; generate(); }
    });
    inp.addEventListener('change', generate);
  });
  ['armor', 'die', 'minions', 'patron', 'abilities'].forEach((id) => $(id).addEventListener('change', generate));

  // --- Rendering ------------------------------------------------------------
  const stat = (label, val, sub) => `<div class="stat"><span class="label">${label}</span><div class="val">${val}</div>${sub ? `<span class="sub">${sub}</span>` : ''}</div>`;
  const dmg = (a) => stat('Damage', esc(a.text), `avg ${a.average}${a.exact ? '' : ' ≈'}`);
  const armorSub = (key) => (key === 'medium' ? 'Medium armor' : key === 'heavy' ? 'Heavy armor' : '');

  function render(e) {
    let h;
    if (e.mode === 'legendary') {
      const L = e.legendary;
      h = header(`${esc(e.difficulty.name)} Boss Fight`, `${e.heroes} heroes, level ${e.level}`) +
      `<section class="block big">
        <div class="kicker">Legendary · Level ${L.statLevel} · acts after each hero's turn</div>
        <h3 class="legend-name bname" style="font-variant:normal;font-style:normal;font-size:2rem"><span contenteditable="true" spellcheck="false">The Boss</span></h3>
        <div class="stats" style="--n: 4">
          ${stat('HP', L.hp, L.armor.replace(' Armor', ' armor'))}
          ${stat('Move &amp; Hit', esc(L.small.attack.text), `avg ${L.small.attack.average}`)}
          ${stat('Big Hit', esc(L.big.attack.text), `avg ${L.big.attack.average}`)}
          ${stat('Save DC', L.dc)}
        </div>
        <div class="bar"><b>Bloodied</b> at <span class="red">${L.bloodied} HP</span></div>
        <div class="bar"><b>Last Stand</b> at 0 HP: dies after <span class="red">${L.lastStand}</span> more damage</div>
      </section>`;
    } else {
      const total = e.groups.reduce((s, g) => s + g.count, 0);
      const foes = `${total} monster${total === 1 ? '' : 's'}${e.minions ? ` + ${e.minions.count} minions` : ''}`;
      const blocks = e.groups.map((g, gi) => {
        const m = g.monster;
        const [abName, ...abRest] = m.ability ? m.ability.split('. ') : [];
        return `<section class="block">
          <div class="bhead">
            <div class="bname"><span contenteditable="true" spellcheck="false">Monster ${letters[gi]}</span><span class="count">×${g.count}</span></div>
            <span class="lvl">lvl ${m.label}</span>
          </div>
          <div class="stats">${stat('HP', m.hp, armorSub(m.armor.key))}${dmg(m.attack)}${stat('Save DC', m.dc)}</div>
          ${m.ability ? `<div class="bar"><b>${esc(abName)}.</b> ${esc(abRest.join('. '))}</div>` : ''}
        </section>`;
      });
      if (e.minions) {
        blocks.push(`<section class="block">
          <div class="bhead">
            <div class="bname"><span contenteditable="true" spellcheck="false">Minions</span><span class="count">×${e.minions.count}</span></div>
          </div>
          <div class="stats" style="--n: 2">${stat('HP', '—', 'dies in one hit')}${stat('Damage', `1d${e.minions.die}`, 'no crits, miss on 1')}</div>
        </section>`);
      }
      // Two columns, filled left then right, like the bestiary pages.
      const half = Math.ceil(blocks.length / 2);
      h = header(`${esc(e.difficulty.name)} Fight`, `${foes} vs ${e.heroes} heroes, level ${e.level}`) +
        `<div class="cols"><div>${blocks.slice(0, half).join('')}</div><div>${blocks.slice(half).join('')}</div></div>`;
    }
    const r = e.reward;
    h += `<section class="block"><div class="bname">Loot</div>
      <div class="stats" style="--n: 2">${stat('Each hero', gp(r.perHero))}${stat(`Whole party (${e.heroes})`, gp(r.party))}</div></section>`;
    out.innerHTML = h;
  }

  function header(title, sub) {
    return `<div class="rhead">
        <div><h2>${title}</h2><div class="sub">${sub}</div></div>
        <div class="toolbar">
          <button class="btn primary" data-act="new">New Encounter</button>
          <button class="btn" data-act="dice">New Dice</button>
          <button class="btn" data-act="copy">Copy as Text</button>
        </div>
      </div>`;
  }

  // --- Actions ----------------------------------------------------------------
  out.addEventListener('click', async (ev) => {
    const b = ev.target.closest('button[data-act]');
    if (!b) return;
    if (b.dataset.act === 'new') return generate();
    if (b.dataset.act === 'dice') return newDice();
    const t = asText();
    try { await navigator.clipboard.writeText(t); b.textContent = 'Copied!'; }
    catch { window.prompt('Copy this:', t); }
    setTimeout(() => (b.textContent = 'Copy as Text'), 1500);
  });

  function generate() { current = Gen.generate(readOpts()); render(current); }

  // Same monsters, new dice (same averages). Keeps any names the GM typed.
  function newDice() {
    const d = $('die').value === 'any' ? Gen.ALL_DICE : [Number($('die').value)];
    if (current.mode === 'legendary') {
      const L = current.legendary;
      L.small.attack = Gen.randomDice(L.small.avg, { dice: d, attackOptions: [1] });
      L.big.attack = Gen.randomDice(L.big.avg, { dice: d, attackOptions: [1] });
    } else {
      current.groups.forEach((g) => { g.monster.attack = Gen.randomDice(g.monster.dpr, { dice: d }); });
    }
    const names = [...out.querySelectorAll('[contenteditable]')].map((n) => n.textContent);
    render(current);
    out.querySelectorAll('[contenteditable]').forEach((n, i) => { if (names[i] !== undefined) n.textContent = names[i]; });
  }

  function asText() {
    const e = current;
    const names = [...out.querySelectorAll('[contenteditable]')].map((n) => n.textContent.trim());
    const lines = [];
    if (e.mode === 'legendary') {
      const L = e.legendary;
      lines.push(`${e.difficulty.name} boss fight: ${e.heroes} heroes, level ${e.level}`,
        `${names[0]} (legendary, level ${L.statLevel}): HP ${L.hp}, ${L.armor}, Save DC ${L.dc}`,
        `  Acts after each hero's turn.`,
        `  Move & hit: ${L.small.attack.text} (avg ${L.small.attack.average})`,
        `  Big hit: ${L.big.attack.text} (avg ${L.big.attack.average})`,
        `  Bloodied at ${L.bloodied} HP. Last Stand: dies after ${L.lastStand} more damage.`);
    } else {
      lines.push(`${e.difficulty.name} fight: ${e.heroes} heroes, level ${e.level}`);
      e.groups.forEach((g, i) => {
        const m = g.monster;
        const armor = m.armor.key === 'none' ? '' : `, ${m.armor.name}`;
        lines.push(`- ${g.count}× ${names[i]}: HP ${m.hp}${armor}, ${m.attack.text} (avg ${m.attack.average}), Save DC ${m.dc}${m.ability ? `. ${m.ability}` : ''}`);
      });
      if (e.minions) lines.push(`- ${e.minions.count}× ${names[e.groups.length]}: 1d${e.minions.die} each, one hit kills, miss on a 1`);
    }
    lines.push(`Loot: ${gp(e.reward.perHero)} each (${gp(e.reward.party)} total)`);
    return lines.join('\n');
  }

  generate();
})();
</script>
</body>
</html>
